plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.foysol.jarvis"
    compileSdkVersion 36
    // Flutter plugins currently require NDK r28c. Pinning the highest required
    // version prevents CI from silently selecting an older incompatible NDK.
    ndkVersion "28.2.13676358"
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.foysol.jarvis"
        // Chaquopy 17.x requires minSdk 24+; keeping 26 (already above the floor).
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // Python interpreter is a native component - must declare ABIs explicitly.
        // arm64-v8a covers essentially all real devices from the last ~6 years.
        // armeabi-v7a added for older/budget devices. Drop x86/x86_64 unless you
        // specifically need emulator builds - each ABI adds ~15-20MB to the APK.
        ndk {
            abiFilters "arm64-v8a"
        }

        // No `python { pip { ... } }` block: offline_server.py is stdlib-only
        // on purpose (sqlite3, http.server - both ship with Chaquopy for free).
        // Packages with native/C extensions (numpy, aiosqlite's C deps, etc.)
        // frequently fail to cross-compile for Android and are the #1 cause of
        // "builds locally, fails in CI" Chaquopy reports. Add a `python { pip {
        // install "..." } }` block here only after confirming the package has
        // an Android wheel at https://chaquo.com/pypi/.
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            // Local/source audits fall back to the Android debug certificate.
            // Public CI releases are gated on an owner-supplied keystore.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Flutter and some native plugins add their own default architectures during
// configuration. Finalize the phone release ABI set after every plugin has
// contributed so Chaquopy/JNI cannot re-add emulator-only x86 payloads.
androidComponents {
    finalizeDsl { extension ->
        extension.defaultConfig.ndk.abiFilters.clear()
        extension.defaultConfig.ndk.abiFilters.addAll(["arm64-v8a"])
    }
}

flutter {
    source '../..'
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.multidex:multidex:2.0.1"
    // Needed for the foreground service that keeps the offline Python
    // gateway alive when the app is backgrounded.
    // 1.18.0 is the newest Core release compatible with compileSdk 36 and
    // AGP 8.11. AndroidX Core 1.19+ requires SDK 37 and AGP 9.1.
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
