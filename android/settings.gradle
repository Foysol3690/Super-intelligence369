pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File('local.properties')
        if (file.exists()) {
            properties.load(new FileInputStream(file))
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (sdkPath == null) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }
        if (sdkPath == null) {
            throw new GradleException("Flutter SDK path not found. Ensure FLUTTER_ROOT is set or local.properties defines flutter.sdk.")
        }
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://chaquo.com/maven" }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.chaquo.python" version "17.0.0" apply false
}

include ":app"
